aid: 51offer
name: 51offer
description: >-
  51offer (Shanghai Huizhi Business Consulting Co., Ltd. / 上海汇紫商务咨询有限公司) is a Shanghai-based
  one-stop online study-abroad platform for Chinese students applying to universities in the United
  Kingdom, Australia, the United States, New Zealand, Japan and Singapore. Its consumer surface
  covers DIY application filing, AI/big-data school and course matching, personal-statement and
  document services, language training (IELTS/TOEFL), adviser and channel-partner services, a
  study-abroad mall with online contract signing, payment and refund flows, a GPA calculator and a
  student content and community section. 51offer publishes no developer program, but its official
  site www.51offer.com serves a public, unauthenticated Swagger 1.2 API listing at /api-docs
  ("Horizon Site APIConfig List / 51offer官网所有开放接口清单") describing 24 controllers and several
  hundred JSON operations, and that listing is the machine-readable contract profiled here.
