openapi: 3.1.0
info:
  title: 51offer Horizon Site API
  version: '1.0'
  summary: 51offer official-site (www.51offer.com) JSON API surface
  description: Machine-readable description of the public JSON API surface of 51offer's official study-abroad site (www.51offer.com).
    Converted, without additions, from the Swagger 1.2 documents 51offer itself serves at https://www.51offer.com/api-docs
    — whose own info block reads "Horizon Site APIConfig List / 51offer官网所有开放接口清单" (the list of all open interfaces on the
    51offer official site) with contact woodrow.w@51offer.com. Every path, method, operationId, summary, parameter, response
    code and model here comes from those documents; nothing was invented. Endpoints cover DIY study-abroad applications, school
    selection and matching, adviser and channel services, the mall/ordering and refund flows, GPA calculation, language-training
    correction, sign-in and user profile.
  contact:
    name: 51offer
    email: woodrow.w@51offer.com
    url: https://www.51offer.com/
  x-provenance:
    converted-from: Swagger 1.2
    source: https://www.51offer.com/api-docs
    fetched: '2026-09-05'
servers:
- url: https://www.51offer.com
  description: '51offer official site API host. Verified live 2026-09-05: GET /ngGpaCalc/constants returned HTTP 200 application/json.'
- url: https://m.51offer.com
  description: 51offer mobile-site host. Serves the same Swagger 1.2 documents at /api-docs (HTTP 200, application/json, 2026-09-05).
