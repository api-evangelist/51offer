    VO_-_183f88:
      type: object
      properties:
        id:
          type: integer
          format: int32
        orderCode:
          type: string
          description: 支付单编号（主单编号）
        orderType:
          type: integer
          format: int32
          description: 订单类型（各业务线标识） 1=联合 2=留学 3=语培 4=文书 5=签证
        unionCode:
          type: string
          description: 联合订单编号(只有联合订单的子单，此属性才会有值)
        uid:
          type: integer
          format: int32
          description: 订单用户ID
        originalPrice:
          type: integer
          format: int32
          description: (商品/sku)原价,单位=分
        costPrice:
          type: integer
          format: int32
          description: (商品/sku)成本价,单位=分
        realPrice:
          type: integer
          format: int32
          description: (商品/sku)实际售价,单位=分
        orderAmount:
          type: integer
          format: int32
          description: (订单)应收金额,单位=分,(应收金额=实际售价-优惠金额-优惠券金额)
        discountAmount:
          type: integer
          format: int32
          description: 优惠金额（单位：分）,(后台下单，顾问手动填写的优惠额)
        payPrice:
          type: integer
          format: int32
          description: (订单)实收金额,单位=分,(用户实际支付的金额,如果产生1单多笔支付,则会统计此单的所有出/入帐总和)
        payTime:
          type: string
          format: date-time
          description: 订单支付时间
        orderStatus:
          type: integer
          format: int32
          description: 订单状态0=待支付 可跳转- 部分支付、支付完成、取消订单；1=部分支付 可跳转- 支付完成、取消订单、退款中；2=支付完成 可跳转- 取消订单、已升级、已转移、退款中；3=订单取消 无跳转；4=已升级 无跳转；5=已转移 无跳转；6=退款中 可跳转- 退款完成；7=退款完成 无跳转
        refundPrice:
          type: integer
          format: int32
          description: 退款金额，单位=分,(如有多笔出帐，会记录其总和)
        refundTime:
          type: string
          format: date-time
          description: 退款时间(退款时间，由财务录入)
        goodsId:
          type: integer
          format: int32
          description: 商品ID
        goodsName:
          type: string
          description: 商品名称
        sku:
          type: integer
          format: int32
          description: SKU id
        skuType:
          type: integer
          format: int32
          description: 商品类型（SKU里面字段）
        orderRemark:
          type: string
          description: 订单备注
        couponNo:
          type: string
          description: 优惠券号
        couponPrice:
          type: integer
          format: int32
          description: 优惠券金额，单位=分
        refrenceUid:
          type: integer
          format: int32
          description: 订单推荐人(暂未启用字段)
        orderBelongId:
          type: integer
          format: int32
          description: (成单人)订单所属ID,顾问ID或部门ID，此字段值要结合orderBelongType一起来使用
        orderBelongType:
          type: integer
          format: int32
          description: (成单人类型)订单所属类型, 1顾问 2部门
        hasOpenService:
          type: integer
          format: int32
          description: 是否已开启服务,0未开启 1已开启
        openServiceTime:
          type: string
          format: date-time
          description: 开启服务时间
        serviceOrderCode:
          type: string
          description: 业务单编号
        orderCreator:
          type: integer
          format: int32
        orderCreated:
          type: string
          format: date-time
        orderModifier:
          type: integer
          format: int32
        orderModified:
          type: string
          format: date-time
        invoiceNumber:
          type: string
          description: 发票号
        isCost:
          type: integer
          format: int32
        skuName:
          type: string
          description: sku名称
        service53Code:
          type: string
          description: 53客服编码
        goodsPriceYuan:
          type: integer
          format: int64
          description: 商品实际售价 元
        receivableAmountYuan:
          type: integer
          format: int64
          description: 应收金额 元
        paidAmountYuan:
          type: integer
