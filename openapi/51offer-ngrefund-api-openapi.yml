          format: int64
          description: 剩余支付金额 元
        couponAmountYuan:
          type: integer
          format: int64
          description: 优惠券金额 元
        refundAmountYuan:
          type: integer
          format: int64
          description: 退款金额 元
        servicePageUrlPc:
          type: string
          description: 服务单PC落地页URL
        servicePageUrlH5:
          type: string
          description: 服务单H5落地页URL
        orderTypeName:
          type: string
          description: 订单类型名称
        orderStatusName:
          type: string
          description: 订单状态名称
        skuAttrs:
          type: array
          items:
            $ref: '#/components/schemas/SkuAttr'
          description: sku属性列表
        unionOrderList:
          type: array
          items:
            $ref: '#/components/schemas/VO_-_183f88'
          description: 联合订单子订单列表
        isRefund:
          type: boolean
          description: 是否有退款记录
        discountAmountYuan:
          type: integer
          format: int64
          description: 优惠金额（单位：元）,(后台下单，顾问手动填写的优惠额)
        orderCreatorRole:
          type: integer
          format: int32
          description: 角色
        whetherContract:
          type: boolean
          description: 是否存在在线合同
