- name: ngrefund
  description: 订单退款控制层
paths:
  /ngrefund/info:
    get:
      operationId: getEntranceRefund
      tags:
      - ngrefund
      summary: 获取入学退款申请
      parameters:
      - name: orderCode
        in: query
        required: true
        schema:
          type: string
      - name: orderId
        in: query
        required: true
        schema:
          type: integer
          format: int32
      - name: key
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResult_VO_698bb0'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      x-swagger-1-2-source: https://www.51offer.com/api-docs/default/ngrefund
  /ngrefund/progress:
    get:
      operationId: getRefundProgress
      tags:
      - ngrefund
      summary: 获取退款进度
      parameters:
      - name: orderCode
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResult_VO_698bb0'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      x-swagger-1-2-source: https://www.51offer.com/api-docs/default/ngrefund
  /ngrefund/sub:
    post:
      operationId: submitEntranceRefund
      tags:
      - ngrefund
      summary: 提交入学退款申请
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderMallRefundParam'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpResult_boolean_f50dfc'
        '201':
          description: Created
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not Found
      x-swagger-1-2-source: https://www.51offer.com/api-docs/default/ngrefund
components:
  schemas:
    VO_629325:
      type: object
      description: 入学退款信息展示用对象
      properties:
